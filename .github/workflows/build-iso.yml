name: Build FapOS Live ISO

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag'
        required: false
        default: 'nightly'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install live-build and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync \
            git \
            ca-certificates

      - name: Configure live-build
        run: |
          mkdir -p lb-build
          cd lb-build

          # Basic configuration for Ubuntu-based live system
          lb config \
            --distribution noble \
            --archive-areas "main restricted universe multiverse" \
            --parent-distribution noble \
            --parent-archive-areas "main restricted universe multiverse" \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --bootappend-live "boot=live components hostname=fapos username=usuario" \
            --debian-installer false \
            --firmware-binary true \
            --firmware-chroot true \
            --iso-application "FapOS" \
            --iso-preparer "FapOS Builder" \
            --iso-publisher "https://github.com/jesusxal777-boop/FapOS" \
            --iso-volume "FapOS 1.0" \
            --memtest none \
            --win32-loader false

          # Add packages
          mkdir -p config/package-lists
          cat > config/package-lists/fapos.list.chroot << EOF
          plank
          xprintidle
          libnotify-bin
          notify-osd
          network-manager
          firefox
          gedit
          nautilus
          gnome-terminal
          sudo
          curl
          wget
          git
          ca-certificates
          EOF

          # Include our scripts and branding
          mkdir -p config/includes.chroot/usr/local/bin
          mkdir -p config/includes.chroot/etc
          mkdir -p config/includes.chroot/usr/share/backgrounds/fapos
          mkdir -p config/includes.chroot/etc/skel/.config/autostart

          cp ../scripts/fapos-idle-monitor.sh config/includes.chroot/usr/local/bin/
          chmod +x config/includes.chroot/usr/local/bin/fapos-idle-monitor.sh

          cp ../branding/os-release config/includes.chroot/etc/
          cp ../branding/lsb-release config/includes.chroot/etc/

          cp ../configs/autostart/* config/includes.chroot/etc/skel/.config/autostart/

          # Simple hook to set hostname and enable services later
          mkdir -p config/hooks/live
          cat > config/hooks/live/0010-fapos.hook.chroot << 'HOOK'
          #!/bin/bash
          echo "fapos" > /etc/hostname
          chmod +x /usr/local/bin/fapos-idle-monitor.sh
          HOOK
          chmod +x config/hooks/live/0010-fapos.hook.chroot

      - name: Build the ISO (this can take a long time)
        run: |
          cd lb-build
          sudo lb build 2>&1 | tee build.log
        continue-on-error: true

      - name: Check for ISO
        id: check_iso
        run: |
          cd lb-build
          if ls *.iso 1> /dev/null 2>&1; then
            echo "iso_found=true" >> $GITHUB_OUTPUT
            ls -lh *.iso
          else
            echo "iso_found=false" >> $GITHUB_OUTPUT
            echo "No ISO produced. Check build.log"
            tail -100 build.log || true
          fi

      - name: Upload ISO artifact
        if: steps.check_iso.outputs.iso_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FapOS-Live-ISO
          path: lb-build/*.iso
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: lb-build/build.log
          retention-days: 7
